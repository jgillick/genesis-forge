[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "genesis-forge"
version = "1.0.0"
authors = [{ name = "Jeremy Gillick" }]
description = "A robotics RL training framework for Genesis inspired by Isaac Lab and Gymnasium."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  # Released in lockstep: the two ship together at the same version, so this is an
  # exact pin. It constrains only the training machine -- a robot installs
  # genesis-forge-runtime on its own, unconstrained by anything here.
  "genesis-forge-runtime==1.0.0",
  "genesis-world>=1.0.0",
  "gymnasium",
  "pysdl2",
  "pysdl2-dll",
  "rsl-rl-lib",
  "skrl[torch]",
  "torch>=2.10.0",
  "tensordict",
  "deprecated>=1.3.1",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/jgillick/genesis-forge"
Issues = "https://github.com/jgillick/genesis-forge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/genesis_forge"]

[tool.uv.sources]
genesis-forge-runtime = { workspace = true }
