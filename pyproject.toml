# Workspace root. Not a distribution itself -- both published packages live under
# packages/, each with its own pyproject, source tree, and tests.
#
#   packages/genesis-forge/          the training framework
#   packages/genesis-forge-runtime/  the simulation-free robot runtime
#
# They are released in lockstep at the same version; see the dependency pin in
# packages/genesis-forge/pyproject.toml for why.

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
genesis-forge = { workspace = true }
genesis-forge-runtime = { workspace = true }

[dependency-groups]
dev = [
    "genesis-forge",
    "genesis-forge-runtime",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "twine>=7.0.0",
]

[tool.ruff]
# Where first-party code lives, so import sorting keeps knowing which packages
# are ours now that both sit behind a src/ directory.
src = ["packages/genesis-forge/src", "packages/genesis-forge-runtime/src"]

[tool.pytest.ini_options]
testpaths = ["packages/genesis-forge/tests", "packages/genesis-forge-runtime/tests"]
filterwarnings = [
    # Raised by the `genesis` package's own imports, not by genesis-forge code.
    "ignore:`torch.jit.script` is deprecated.*:DeprecationWarning",
    "ignore:Using SDL2 binaries from pysdl2-dll.*:UserWarning",
]
