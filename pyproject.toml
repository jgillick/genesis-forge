[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "genesis-forge"
version = "1.0.0"
authors = [{ name = "Jeremy Gillick" }]
description = "A robotics RL training framework for Genesis inspired by Isaac Lab and Gymnasium."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "genesis-forge-deploy",
  "genesis-world>=1.0.0",
  "gymnasium",
  "pysdl2",
  "pysdl2-dll",
  "rsl-rl-lib",
  "skrl[torch]",
  "torch>=2.10.0",
  "tensordict",
  "deprecated>=1.3.1",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/jgillick/genesis-forge"
Issues = "https://github.com/jgillick/genesis-forge/issues"

[tool.hatch.build.targets.sdist]
exclude = ["Makefile", "docs/", ".readthedocs.yaml", "*.mp4", "*.xcf"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "twine>=7.0.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    # Raised by the `genesis` package's own imports, not by genesis-forge code.
    "ignore:`torch.jit.script` is deprecated.*:DeprecationWarning",
    "ignore:Using SDL2 binaries from pysdl2-dll.*:UserWarning",
]

[tool.uv.workspace]
members = ["deploy"]

[tool.uv.sources]
genesis-forge-deploy = { workspace = true }
