[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[project]
name = "genesis-forge"
version = "0.3.0"
authors = [{ name = "Jeremy Gillick" }]
description = "A robotics RL training framework for Genesis inspired by Isaac Lab and Gymnasium."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "genesis-world>=0.4.0",
  "gymnasium",
  "deprecated",
  "hidapi",
  "skrl[torch]",
  "torch",
  "tensordict",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/jgillick/genesis-forge"
Issues = "https://github.com/jgillick/genesis-forge/issues"

[tool.uv.build-backend]
module-name = "genesis_forge"
module-root = ""
source-exclude = ["Makefile", "docs/", ".readthedocs.yaml", "*.mp4", "*.xcf"]
